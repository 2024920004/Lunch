# Render 部署蓝图：New → Blueprint → 选中本仓库即可一键创建服务
services:
  - type: web
    name: snack-order
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # 在 Render 控制台里填写真实值（这里只声明变量名）
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

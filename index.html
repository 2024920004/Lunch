// 提交：paid=true 表示「已付款下单」，下单时直接标记为已付款
function submitOrder(paid){
  if(!cart.length) return;
  let t = 0, n = 0;
  const items = [];
  const missing = [];
  cart.forEach(l=>{
    const m = dishOfLine(l);
    if(!m){ missing.push(l.name || '（已下架菜品）'); return; }
    const unit = unitPrice(m, l.sauces, l.comments, l.stacks);
    t += unit * l.qty;
    n += l.qty;
    items.push({id:m.id, name:m.name, desc:m.desc, q:l.qty, unit, opts:[...l.opts], sauces:orderSauces(m, l.sauces), comments:orderComments(m, l.comments), stacks:orderStacks(m, l.stacks), note:l.note||''});
  });
  if(!items.length){
    if(missing.length) showToast('⚠️', '无法提交', '菜单里找不到：' + missing.join('、'));
    return;
  }
  if(missing.length) showToast('⚠️', '部分菜品已跳过', '菜单里找不到：' + missing.join('、'));
  const d = new Date();
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

  if(editingOrderNo != null){
    // 修改模式：替换原待处理订单（保留单号与排序位置）
    const o = orders.find(x=>String(x.no)===String(editingOrderNo));
    if(o){
      o.items = items; o.count = n; o.total = t; o.time = time; o.note = orderNote.trim();
      if(paid) o.paid = true;                    // 点「已付款下单」时才改为已付款，普通保存不动付款状态
      delete o.doneAt; delete o.backAt;
    }
    const no = editingOrderNo;
    editingOrderNo = null;
    saveOrders(); renderHistory();
    showToast('✅', paid ? '已保存（已付款）' : '修改已保存', `${n} 件 · ${eu(t)} · 单号 ${no}`);
  } else {
    // 订单号码：手填就用填的（重复则拦截）；留空则自动编号。
    // 自动编号与手填号码互不影响：自动序列只看「自动单」，例：1、2、3 → 手填 2202 → 下一个自动仍是 4
    const wanted = manualNo.trim();
    let no, src;
    if(wanted){
      if(orders.some(o=>String(o.no)===wanted)){
        showToast('⚠️', '订单号已存在', `单号 ${wanted} 已被使用，请换一个或留空自动生成`);
        return;
      }
      no = wanted; src = 'manual';
    } else {
      no = orders.filter(o=>o.src !== 'manual').reduce((mx,o)=>Math.max(mx, Number(o.no)||0), 0) + 1;
      src = 'auto';
    }
    orders.unshift({no, src, at: Date.now(), time, items, count:n, total:t, note: orderNote.trim(), paid: !!paid});   // 排序用 at，与单号无关
    saveOrders(); renderHistory();
    showToast(paid ? '💰' : '✅', paid ? '已付款下单成功' : '下单成功', `${n} 件 · ${eu(t)} · 单号 ${no}`);
  }
  cart = []; clearOrderMeta(); save(); renderMenu(); renderOrder();
}
$('#submitBtn').addEventListener('click', ()=>submitOrder(false));
$('#submitPaidBtn').addEventListener('click', ()=>submitOrder(true));

// ===== 登录 / 注册 / 权限 =====

// 用户管理页内容
function renderUsers(){
  if(!isAdmin()) return;
  const pend = users.filter(u=>u.status==='pending');
  const pc = $('#pendCount'), ac = $('#allCount');
  if(pc) pc.textContent = pend.length;
  if(ac) ac.textContent = users.length;

  $('#pendingUsers').innerHTML = pend.length ? pend.map(u=>`
    <div class="urow pend">
      <span class="uname">${u.u}</span>
      <span class="ust pending">待审核</span>
      <button class="btn-ok" data-ok="${u.u}">同意</button>
      <button class="clear" data-rm="${u.u}">拒绝</button>
    </div>`).join('') : `<div class="uempty">暂无待审核的注册</div>`;

  $('#allUsers').innerHTML = users.map(u=>{
    const tag = u.role==='admin' ? '<span class="ust adm">管理员</span>'
              : u.status==='active' ? '<span class="ust active">正常</span>'
              : '<span class="ust pending">待审核</span>';
    const op = u.u===currentUser.u ? '<span class="you">当前账号</span>'
             : `<button class="clear" data-rm="${u.u}">删除</button>`;
    return `<div class="urow"><span class="uname">${u.u}</span>${tag}${op}</div>`;
  }).join('') || `<div class="uempty">暂无用户</div>`;
}

// 按当前身份刷新界面
function applyAuth(){
  const logged = !!currentUser;
  document.body.classList.toggle('auth-locked', !logged);
  if(!logged) return;
  $('#whoami').textContent = currentUser.u;
  const role = $('#whoRole');
  role.textContent = isAdmin() ? '管理员' : '普通用户';
  role.classList.toggle('user', !isAdmin());
  $('#navUsers').style.display = isAdmin() ? '' : 'none';
  // 普通用户不能清空 / 删除订单
  $('#clearBtn').style.display = isAdmin() ? '' : 'none';
  $('#clearHistory').style.display = isAdmin() ? '' : 'none';
  renderUsers();
}

// 登录 / 注册 表单切换
function showForm(isRegister){
  $('#loginForm').style.display = isRegister ? 'none' : '';
  $('#registerForm').style.display = isRegister ? '' : 'none';
  $('#loginSub').textContent = isRegister ? '注册后需管理员同意才能登录' : '请登录后使用';
  $('#lgMsg').textContent = ''; $('#rgMsg').textContent = '';
}
$('#toRegister').addEventListener('click', ()=>showForm(true));
$('#toLogin').addEventListener('click', ()=>showForm(false));

// 登录
function doLogin(){
  const u = $('#lgUser').value.trim(), p = $('#lgPass').value, msg = $('#lgMsg');
  const fail = t => { msg.className = 'login-msg'; msg.textContent = t; };
  if(!u || !p) return fail('请输入用户名和密码');
  const user = findUser(u);
  if(!user || user.p !== p) return fail('用户名或密码不正确');
  if(user.status !== 'active') return fail('账号还在等待管理员同意，暂时不能登录');
  currentUser = user;
  localStorage.setItem(SESSION_KEY, u);
  $('#lgPass').value = '';
  msg.className = 'login-msg'; msg.textContent = '';
  applyAuth();
  switchView('order');
  showToast('👋', '登录成功', (isAdmin() ? '管理员 · ' : '') + u);
}
$('#lgLogin').addEventListener('click', doLogin);
['lgUser','lgPass'].forEach(id=>$('#'+id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));

// 注册普通用户（提交后需管理员同意）
$('#rgSubmit').addEventListener('click', ()=>{
  const u = $('#rgUser').value.trim(), p = $('#rgPass').value, p2 = $('#rgPass2').value;
  const msg = $('#rgMsg');
  const fail = t => { msg.className = 'login-msg'; msg.textContent = t; };
  if(u.length < 2) return fail('用户名至少 2 个字符');
  if(p.length < 3) return fail('密码至少 3 位');
  if(p !== p2) return fail('两次输入的密码不一样');
  if(findUser(u)) return fail('这个用户名已经被注册了');
  users.push({u, p, role:'user', status:'pending'});
  saveUsers();
  $('#rgUser').value = ''; $('#rgPass').value = ''; $('#rgPass2').value = '';
  msg.className = 'login-msg ok';
  msg.textContent = '已提交，等待管理员同意后即可登录';
});

// 用户管理：同意 / 拒绝 / 删除
$('#view-users').addEventListener('click', e=>{
  if(!isAdmin()) return;
  const ok = e.target.closest('[data-ok]');
  const rm = e.target.closest('[data-rm]');
  if(ok){
    const u = findUser(ok.dataset.ok);
    if(!u) return;
    u.status = 'active'; saveUsers(); renderUsers();
    showToast('✅', '已同意', `${u.u} 现在可以登录了`);
  }else if(rm){
    const name = rm.dataset.rm;
    if(name === currentUser.u) return;
    const pending = (findUser(name) || {}).status === 'pending';
    users = users.filter(x=>x.u !== name); saveUsers(); renderUsers();
    showToast(pending ? '🚫' : '🗑️', pending ? '已拒绝' : '已删除用户', name);
  }
});

// 修改自己的密码
$('#pwSave').addEventListener('click', ()=>{
  const o = $('#pwOld').value, n = $('#pwNew').value, msg = $('#pwMsg');
  const fail = t => { msg.className = 'login-msg'; msg.textContent = t; };
  if(o !== currentUser.p) return fail('原密码不正确');
  if(n.length < 3) return fail('新密码至少 3 位');
  currentUser.p = n; saveUsers();
  $('#pwOld').value = ''; $('#pwNew').value = '';
  msg.className = 'login-msg ok'; msg.textContent = '密码已更新';
});

// 退出登录
$('#logoutBtn').addEventListener('click', ()=>{
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  $('#lgUser').value = ''; $('#lgPass').value = '';
  showForm(false);
  applyAuth();
});

// ===== 云端同步（Render Node 后端 + Upstash Redis）=====
// 与后端同源部署时留空；本地前后端分开跑可改成 'http://localhost:3000'
const API_BASE = '';
let cloudOn = false;          // 是否已连上后端
let cloudRev = -1;            // 已知的服务端版本号
const COLLS = ['menu','cats','users','orders'];
const dirty = {};             // 本地改了、待推送的集合
const timers = {};            // 推送防抖定时器
const snap = {};              // 上次与云端对齐的数据快照（JSON 字符串）

function collData(name){
  return name==='menu' ? menu : name==='cats' ? cats : name==='users' ? users : name==='orders' ? orders : null;
}
function setCloud(ok){
  cloudOn = ok;
  const b = document.getElementById('cloudBadge');
  const t = document.getElementById('cloudText');
  if(b){ b.classList.toggle('on', ok); b.classList.toggle('off', !ok); }
  if(t) t.textContent = ok ? '云端已连接' : '离线（仅本机）';
}
// 本地改动后把对应集合推送到云端（防抖 350ms）
function cloudPush(name){
  if(!cloudOn) return;
  dirty[name] = true;
  clearTimeout(timers[name]);
  timers[name] = setTimeout(()=>cloudFlush(name), 350);
}
async function cloudFlush(name){
  if(!cloudOn || !dirty[name]) return;
  const patch = {}; patch[name] = collData(name);
  try{
    const r = await fetch(API_BASE + '/api/state', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(typeof j.rev === 'number') cloudRev = j.rev;
    snap[name] = JSON.stringify(collData(name));
    dirty[name] = false;
    setCloud(true);
  }catch(e){ setCloud(false); }
}
// 把云端数据应用到本机（只应用没在本地编辑、且确实变化的集合）
function applyRemote(s){
  let menuCh=false, catsCh=false, usersCh=false, ordersCh=false;
  if(Array.isArray(s.cats) && !dirty.cats && JSON.stringify(s.cats)!==snap.cats){
    cats = s.cats; snap.cats = JSON.stringify(cats); catsCh = true;
  }
  if(Array.isArray(s.menu) && !dirty.menu && editingId==null && JSON.stringify(s.menu)!==snap.menu){
    menu = s.menu; snap.menu = JSON.stringify(menu); menuCh = true;
  }
  if(Array.isArray(s.users) && !dirty.users && JSON.stringify(s.users)!==snap.users){
    users = s.users; snap.users = JSON.stringify(users); usersCh = true;
    try{ localStorage.setItem(USER_KEY, JSON.stringify(users)); }catch(e){}
    if(currentUser && !users.find(x=>x.u===currentUser.u && x.status==='active')){
      currentUser = null; applyAuth();
    }
  }
  if(Array.isArray(s.orders) && !dirty.orders && editingOrderNo==null && JSON.stringify(s.orders)!==snap.orders){
    orders = s.orders; snap.orders = JSON.stringify(orders); ordersCh = true;
  }
  if(menuCh || catsCh){ renderCats(); renderMenu(); renderAdmin(); }
  if(ordersCh){ renderHistory(); renderOrder(); }
  if(usersCh && document.getElementById('view-users').classList.contains('active')) renderUsers();
}
async function cloudGet(){
  const r = await fetch(API_BASE + '/api/state');
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
// 首次连接：云端为空就把本机现有数据上传（迁移），否则拉取云端数据
async function cloudInit(){
  try{
    const s = await cloudGet();
    setCloud(true);
    if((Number(s.rev)||0) === 0){
      const patch = {};
      COLLS.forEach(c=>{ patch[c] = collData(c); });
      const r = await fetch(API_BASE + '/api/state', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch)
      });
      const j = await r.json();
      if(typeof j.rev === 'number') cloudRev = j.rev;
      COLLS.forEach(c=>{ snap[c] = JSON.stringify(collData(c)); dirty[c] = false; });
      showToast('☁️', '已同步到云端', '本机数据已上传，其它设备可共享');
    }else{
      cloudRev = Number(s.rev) || 0;
      applyRemote(s);
    }
  }catch(e){ setCloud(false); }
}
// 之后定时拉取，有更新就应用
async function cloudPoll(){
  if(document.hidden) return;
  try{
    const s = await cloudGet();
    setCloud(true);
    const rev = Number(s.rev) || 0;
    if(rev === cloudRev) return;
    cloudRev = rev;
    applyRemote(s);
  }catch(e){ setCloud(false); }
}

// ===== 数据备份：导出 / 导入 =====
function exportBackup(){
  const data = { _type:'snack-backup', _at:new Date().toISOString(), menu, cats, users, orders };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `snack-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  showToast('📦', '备份已导出', '已保存到「下载」文件夹');
}
async function importBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ showToast('⚠️', '备份文件无法解析', '请选择本系统导出的 .json 文件'); return; }
  if(!data || !Array.isArray(data.menu) || !Array.isArray(data.users)){
    showToast('⚠️', '备份文件格式不对', '请选择本系统导出的 .json 文件'); return;
  }
  if(!confirm('导入会覆盖当前的菜品、分类、订单和用户，确定继续吗？')) return;
  menu = data.menu;
  cats = Array.isArray(data.cats) && data.cats.length ? data.cats : cats;
  orders = Array.isArray(data.orders) ? data.orders : [];
  if(data.users.length) users = data.users;
  saveMenu(); saveCats(); saveOrders(); saveUsers();
  renderCats(); renderMenu(); renderOrder(); renderHistory(); renderAdmin(); renderUsers();
  showToast('✅', '备份已导入', `菜品 ${menu.length} · 订单 ${orders.length} · 用户 ${users.length}`);
}
$('#bakExport').addEventListener('click', exportBackup);
$('#bakImport').addEventListener('click', ()=>$('#bakFile').click());
$('#bakFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) importBackup(f);
});

// 初始化
saveUsers();
currentUser = users.find(x=>x.u === localStorage.getItem(SESSION_KEY) && x.status==='active') || null;
renderCats(); renderMenu(); renderOrder(); renderHistory(); renderAdmin();
applyAuth();
// 云端同步：首次拉取/迁移，之后每 3 秒拉一次（仅页面可见时）
cloudInit();
setInterval(cloudPoll, 3000);
window.addEventListener('focus', cloudPoll);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cloudPoll(); });
</script>

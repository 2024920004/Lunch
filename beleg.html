<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beleg / plain</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e5e9; --txt:#1c1e21;
    --sub:#6b7280; --accent:#ff6b35; --accent-soft:#fff1eb;
    --green:#16a34a; --red:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:10; background:#fff;
    border-bottom:1px solid var(--line); padding:12px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  header h1{font-size:17px; font-weight:800; margin:0; letter-spacing:.3px;}
  header h1 span{color:var(--accent);}
  .spacer{flex:1;}
  .navbtn{
    text-decoration:none; color:var(--txt); border:1px solid var(--line); background:#fff;
    padding:6px 12px; border-radius:9px; font-size:13px; font-weight:800;
  }
  .stat{font-size:13px; color:var(--sub); font-weight:700;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--sub); margin-right:5px; vertical-align:1px;}
  .dot.ok{background:var(--green);} .dot.err{background:var(--red);} .dot.warn{background:#f59e0b;}
  .toggle{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .toggle button{
    border:0; background:#fff; padding:7px 14px; font-size:13px; font-weight:800;
    color:var(--sub); cursor:pointer; font-family:inherit;
  }
  .toggle button.active{background:var(--accent); color:#fff;}
  main{padding:16px;}
  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));}
  .ocard{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .ocard.paid{border-left:4px solid var(--green);}
  .ocard.unpaid{border-left:4px solid var(--red);}
  .ocard.unpaid .ono{color:var(--red);}
  .ocard .ohead{display:flex; align-items:baseline; gap:10px; margin-bottom:8px;}
  .ocard .ono{font-size:18px; font-weight:800; color:var(--accent);}
  /* 4 位数字单号（电话单）：显示为红色「Tel 1234」 */
  .ocard .ono.htel{color:var(--red);}
  /* 电话单：整张卡片浅红底，便于一眼分辨 */
  .ocard.is-tel{background:#fdf0f0;border-color:#f3c2c4;}
  .ocard .otime{font-size:13px; color:var(--sub); font-weight:700;}
  .ocard .onote{
    font-size:12.5px; font-weight:800; color:var(--accent);
    background:var(--accent-soft); border:1px solid #ffd7c4; border-radius:8px;
    padding:4px 8px; margin-bottom:8px; display:inline-block;
  }
  /* 已完成：按下后这张单从待处理列表移走 */
  .ocard .odone{
    display:block; width:100%; margin-top:10px;
    border:1px solid var(--green); background:var(--green); color:#fff;
    font-family:inherit; font-size:14px; font-weight:800;
    padding:8px 10px; border-radius:9px; cursor:pointer;
  }
  .ocard .odone:active{opacity:.85;}
  .ocard .odone:disabled{opacity:.6; cursor:not-allowed;}
  /* 撤回：在「全部」里把误点完成的单放回「Te maken」 */
  .ocard .oundo{
    display:block; width:100%; margin-top:10px;
    border:1px solid var(--line); background:#fff; color:var(--sub);
    font-family:inherit; font-size:14px; font-weight:800;
    padding:8px 10px; border-radius:9px; cursor:pointer;
  }
  .ocard .oundo:active{opacity:.85;}
  .ocard .oundo:disabled{opacity:.6; cursor:not-allowed;}
  .item{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; padding:5px 0; border-top:1px dashed var(--line); line-height:1.6;}
  .item:first-of-type{border-top:0;}
  .item .q{font-weight:800; color:var(--txt); font-size:14px; min-width:26px;}
  .item .nm{font-weight:800; font-size:15px;}
  .item .cat{
    font-size:11px; font-weight:800; color:#fff; background:var(--accent);
    border-radius:6px; padding:1px 6px; text-transform:none;
  }
  /* 可选 / 蘸料 / 评论 / 可叠加：与菜品名同样大小、同样粗度、同样黑色，方便厨房一眼看清 */
  .item .ext{flex:0 0 100%; font-size:15px; font-weight:800; color:var(--txt);}
  .item .desc{flex:0 0 100%; font-size:12.5px; font-weight:700; color:var(--sub);}
  /* Beleg：菜名与简介同样大小、同样颜色 */
  .item.is-beleg .nm, .item.is-beleg .desc{color:#6d28d9; font-size:15px; font-weight:800;}
  .item .note{font-size:12.5px; font-weight:700; color:var(--sub);}
  .empty{color:var(--sub); font-weight:700; text-align:center; padding:60px 20px; font-size:14px;}
  .err{color:var(--red); font-weight:800; text-align:center; padding:40px 20px;}
</style>
</head>
<body>
<header>
  <h1>Beleg <span>·</span> plain <span>·</span> <span id="ttl"></span></h1>
  <a class="navbtn" id="navPending" href="pending.html" target="_blank" rel="noopener"></a>
  <div class="spacer"></div>
  <span class="stat" id="count"></span>
  <div class="toggle">
    <button id="tabPending" class="active"></button>
    <button id="tabAll"></button>
  </div>
  <span class="stat"><span class="dot" id="connDot"></span><span id="connTxt"></span></span>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none"></div>
</main>

<script>
// ===================== 基础设置 =====================
const API_BASE = '';                       // 与后端同源
const LANG_KEY = 'snack_lang_v1';          // 与主应用共用语言设置
let lang = localStorage.getItem(LANG_KEY) || 'zh';
if (lang !== 'zh' && lang !== 'nl') lang = 'zh';

const I18N = {
  zh: { title:'备料单', tabPending:'待处理', tabAll:'全部', empty:'暂无 Beleg / plain 的订单',
        connOk:'已连接', connOffline:'离线·本机数据', connErr:'未连接',
        connErrFull:'连接失败：读不到数据。请在店里那台跑服务的机器上打开本页面。',
        optsPrefix:'可选：', saucesPrefix:'蘸料：', commentsPrefix:'评论：', stacksPrefix:'可叠加：', notePrefix:'备注：',
        markDone:'已完成', undo:'撤回', nOrders:'{0} 单', navPending:'待处理订单' },
  nl: { title:'Overzicht', tabPending:'Te maken', tabAll:'Alles', empty:'Geen Beleg / plain bestellingen',
        connOk:'Verbonden', connOffline:'Offline · lokaal', connErr:'Niet verbonden',
        connErrFull:'Verbinding mislukt: geen gegevens. Open deze pagina op het toestel dat de server draait.',
        optsPrefix:'Keuzes: ', saucesPrefix:'Sausen: ', commentsPrefix:'Opmerkingen: ', stacksPrefix:'Stapelbaar: ', notePrefix:'Opmerking: ',
        markDone:'Afgerond', undo:'Terugzetten', nOrders:'{0} bestellingen', navPending:'Openstaand' }
};
function t(k, ...a){ let s = (I18N[lang] && I18N[lang][k]) || (I18N.zh[k]) || k; a.forEach((v,i)=>{ s = s.replace('{'+i+'}', v); }); return s; }

// ===================== 状态 =====================
let menu = [], orders = [];
let showAll = false;      // 只看待处理 / 看全部
let lastErr = false;      // 连本机数据都没有 → 彻底读不到
let offline = false;      // 后端连不上，但本机有缓存数据
const L_MENU = 'snack_menu_v1', L_ORDERS = 'snack_orders_v1';   // 与主应用同一份本机缓存
// 备料单的「已完成」：不写回订单本身，但存到云端，同一个页面多人/多设备共享（localStorage 只作离线缓存）
const L_PREP_DONE = 'beleg_prep_done_v1';
let prepDone = {};
try{ prepDone = JSON.parse(localStorage.getItem(L_PREP_DONE) || '{}') || {}; }catch(e){ prepDone = {}; }
let marksDirty = false;   // 本机有还没推上云的「已完成」改动
function savePrepDone(){ try{ localStorage.setItem(L_PREP_DONE, JSON.stringify(prepDone)); }catch(e){} }
// 超过 2 天的记录自动清掉，避免无限增长（订单都是当天用完）
function prunePrepDone(){
  const now = Date.now(), MAX = 2 * 24 * 3600 * 1000;
  let changed = false;
  // 值带符号：正 = 完成时间，负 = 撤回时间；都按绝对值判断是否过期
  Object.keys(prepDone).forEach(k => { if(now - Math.abs(Number(prepDone[k]) || 0) > MAX){ delete prepDone[k]; changed = true; } });
  if(changed) savePrepDone();
}

const $ = s => document.querySelector(s);
const norm = v => String(v == null ? '' : v).toLowerCase().trim();
// 「Beleg」「plain」按分类匹配（忽略大小写，允许包含关系）
const isTarget = v => /beleg|plain/.test(norm(v));

function applyLang(){
  document.documentElement.lang = lang === 'nl' ? 'nl' : 'zh-CN';
  document.title = 'Beleg · plain · ' + t('title');
  $('#ttl').textContent = t('title');
  $('#navPending').textContent = t('navPending');
  $('#tabPending').textContent = t('tabPending');
  $('#tabAll').textContent = t('tabAll');
}

// ===================== 取数 =====================
async function load(){
  try{
    const r = await fetch(API_BASE + '/api/state', { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    if(s && s.error) throw new Error(s.error);
    menu = Array.isArray(s.menu) ? s.menu : [];
    orders = Array.isArray(s.orders) ? s.orders : [];
    // 「已完成」：采用云端（所有人共享）的结果；本机若有没推上去的改动，先并集再补推，避免被覆盖
    const remoteDone = (s.prepDone && typeof s.prepDone === 'object' && !Array.isArray(s.prepDone)) ? s.prepDone : {};
    if(marksDirty){
      prepDone = Object.assign({}, remoteDone, prepDone);
      pushMarks();
    }else{
      prepDone = remoteDone;
      savePrepDone();
    }
    prunePrepDone();
    lastErr = false; offline = false;
    setConn('ok');
  }catch(e){
    // 连不上后端：退回本机缓存（和主应用用的是同一份 localStorage）
    const local = readLocal();
    if(local){
      menu = local.menu; orders = local.orders;
      lastErr = false; offline = true;
      setConn('offline');
    }else{
      lastErr = true; offline = false;
      setConn('err');
    }
  }
  render();
}

// 读取本机缓存；没有订单缓存则视为「读不到」
function readLocal(){
  try{
    const raw = localStorage.getItem(L_ORDERS);
    if(raw == null) return null;
    const m = localStorage.getItem(L_MENU);
    return { menu: m ? (JSON.parse(m) || []) : [], orders: JSON.parse(raw) || [] };
  }catch(e){ return null; }
}

function setConn(mode){
  const d = $('#connDot');
  d.className = 'dot ' + (mode === 'ok' ? 'ok' : mode === 'offline' ? 'warn' : 'err');
  $('#connTxt').textContent = mode === 'ok' ? t('connOk') : mode === 'offline' ? t('connOffline') : t('connErr');
}

// ===================== 渲染 =====================
// 菜品 id -> 分类
function catOfItem(it){
  if(!it) return '';
  const m = menu.find(x => String(x.id) === String(it.id));
  return (m && m.cat) || it.cat || '';
}

// 订单唯一标识：单号会重复，定位/改写一律按 uid（与主应用算法保持一致）
function orderUid(o){
  if(!o) return '';
  if(o.uid) return String(o.uid);
  if(o.no == null) return '';
  o.uid = 'u' + String(o.no) + '_' + (Number(o.at) || 0);
  return o.uid;
}
// 备料单的「已完成」（不影响订单本身）。值 > 0 = 已完成；负数 = 已撤回，视为未完成
const isPrepDone = o => Number(prepDone[orderUid(o)]) > 0;
// 「全部」列表排序用：本页点「已完成」的时间；主应用完成的单退回它的点击时间/提交时间
function doneAtOf(o){
  const v = Number(prepDone[orderUid(o)]);
  if(v > 0) return v;
  return Number(o.doneAt) || Number(o.at) || 0;
}

const eu = n => '€' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
// 蘸料/评论展示文本：名称 + 加价（有价才显示）
function sauceText(list){
  return (list || []).map(s => (s.name || s) + (Number(s.price) > 0 ? ' +' + eu(s.price) : '')).join('、');
}
// 可叠加蘸料展示文本：名称×份数 + 叠加后的总加价（有价才显示）
function stackText(list){
  return (list || []).map(s => `${s.name || s}×${s.n || 1}` + (Number(s.price) > 0 ? ' +' + eu(Number(s.price) * (s.n || 1)) : '')).join('、');
}

// 备料单要看到客人选的全部内容：可选 / 蘸料 / 评论 / 可叠加，每项单独一行
function itemExtras(it){
  const lines = [];
  if(it.opts && it.opts.length) lines.push(t('optsPrefix') + it.opts.join(' / '));
  if(it.sauces && it.sauces.length) lines.push(t('saucesPrefix') + sauceText(it.sauces));
  if(it.comments && it.comments.length) lines.push(t('commentsPrefix') + sauceText(it.comments));
  if(it.stacks && it.stacks.length) lines.push(t('stacksPrefix') + stackText(it.stacks));
  return lines;
}

function render(){
  if(lastErr){
    $('#grid').innerHTML = '';
    $('#count').textContent = '';
    $('#empty').className = 'err';
    $('#empty').style.display = 'block';
    $('#empty').textContent = t('connErrFull');
    return;
  }
  $('#empty').className = 'empty';

  // 只保留「Beleg」「plain」分类的菜品行，且订单至少剩一行才显示
  const list = [];
  for(const o of orders){
    const done = o.done || isPrepDone(o);
    // 「Te maken」只看还没做的；「全部」只看已经做完的
    if(showAll ? !done : done) continue;
    const items = (o.items || []).filter(it => isTarget(catOfItem(it)));
    if(items.length) list.push({ o, items });
  }
  // 「Te maken」按提交时间升序（老单在前，新单在后）；
  // 「全部」按在 Te maken 上点「已完成」的先后排序 —— 后点完成的排在最前
  if(showAll) list.sort((a, b) => doneAtOf(b.o) - doneAtOf(a.o));
  else        list.sort((a, b) => (Number(a.o.at) || 0) - (Number(b.o.at) || 0));

  $('#count').textContent = t('nOrders', list.length);

  if(!list.length){
    $('#grid').innerHTML = '';
    $('#empty').style.display = 'block';
    $('#empty').textContent = t('empty');
    return;
  }
  $('#empty').style.display = 'none';

  $('#grid').innerHTML = list.map(({ o, items }) => {
    const noRaw = (o.no == null || o.no === '') ? '' : String(o.no);
    // 4 位数字单号视为电话单，显示为「Tel 1234」并标红
    const isTel = /^\d{4}$/.test(noRaw);
    const no = noRaw === '' ? '' : (isTel ? 'Tel ' + noRaw : '#' + noRaw);
    const note = o.note ? `<div class="onote">${esc(o.note)}</div>` : '';
    const rows = items.map(it => {
      const cat = catOfItem(it);
      const ext = itemExtras(it).map(l => `<span class="ext">${esc(l)}</span>`).join('');
      const ds = it.desc ? `<span class="desc">${esc(it.desc)}</span>` : '';
      const nt = it.note ? `<span class="note">${t('notePrefix')}${esc(it.note)}</span>` : '';
      const bl = /beleg/i.test(cat) ? ' is-beleg' : '';
      return `<div class="item${bl}">
        <span class="q">${it.q}×</span>
        <span class="nm">${esc(it.name || '')}</span>
        ${cat ? `<span class="cat">${esc(cat)}</span>` : ''}
        ${ds}
        ${ext}
        ${nt}
      </div>`;
    }).join('');
    const uid = orderUid(o);
    return `<div class="ocard ${o.paid ? 'paid' : 'unpaid'}${isTel ? ' is-tel' : ''}" data-uid="${esc(uid)}">
      <div class="ohead"><span class="ono${isTel ? ' htel' : ''}">${esc(no || '—')}</span><span class="otime">${esc(o.time || '')}</span></div>
      ${note}${rows}
      ${o.done ? ''
        : (isPrepDone(o)
            ? (showAll ? `<button class="oundo" data-undo="${esc(uid)}">${t('undo')}</button>` : '')
            : `<button class="odone" data-done="${esc(uid)}">${t('markDone')}</button>`)}</div>`;
  }).join('');
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===================== 交互 =====================
// 备料单标记「已完成」：把这张卡移走，并同步到云端 —— 同一个页面的所有人都不再看到它
function markPrepDone(uid){
  const o = orders.find(x => orderUid(x) === uid);
  if(!o || o.done || isPrepDone(o)) return;
  prepDone[uid] = Date.now();
  savePrepDone();
  render();
  pushMarks();
}

// 撤回「已完成」：把这张单放回「Te maken」。写成负时间戳，云端按绝对值取最新操作，
// 因此撤回后其它设备也会同步取消（而不是被别人的并集推送又复活）
function unmarkPrepDone(uid){
  if(!(Number(prepDone[uid]) > 0)) return;
  prepDone[uid] = -Date.now();
  savePrepDone();
  render();
  pushMarks();
}

// 把「已完成」标记推到云端（多人共享）；失败就先留在本机，下次轮询会补推
async function pushMarks(){
  marksDirty = true;
  try{
    const r = await fetch(API_BASE + '/api/state', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prepDone })
    });
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.prepDone && typeof j.prepDone === 'object'){
      prepDone = j.prepDone;            // 采用服务端合并后的权威结果，保证各设备一致
      savePrepDone();
      marksDirty = false;
      render();
    }
  }catch(e){ /* 离线时只留本机改动，下次轮询/联网再同步 */ }
}

$('#grid').addEventListener('click', e=>{
  const d = e.target.closest('.odone');
  if(d){ d.disabled = true; markPrepDone(d.dataset.done); return; }
  const u = e.target.closest('.oundo');
  if(u){ u.disabled = true; unmarkPrepDone(u.dataset.undo); return; }
});

$('#tabPending').addEventListener('click', () => { showAll = false; $('#tabPending').classList.add('active'); $('#tabAll').classList.remove('active'); render(); });
$('#tabAll').addEventListener('click',     () => { showAll = true;  $('#tabAll').classList.add('active'); $('#tabPending').classList.remove('active'); render(); });

document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });

// ===================== 启动 =====================
applyLang();
load();
setInterval(load, 3000);
</script>
</body>
</html>
